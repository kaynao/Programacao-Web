<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancora</title>
</head>
<body>
    <!-- 1. O Alvo lá no topo da página -->
    <h2 id="topo">Início da Página</h2>
    <p>Este é o topo do site. Role para baixo para encontrar o link de retorno.</p>

    <!-- Espaçadores para criar uma página longa (simulando conteúdo) -->
    <div style="height: 1000px; background-color: #f0f0f0; margin: 20px 0; padding: 20px;">
        <p>Imagine que aqui existem vários textos, imagens ou perguntas de um FAQ...</p>
        <p>Continue rolando para baixo até o final da página.</p>
    </div>

    <!-- 2. O Link que aponta para o ID lá de cima usando o caractere '#' -->
    <p>Você chegou ao fim!</p>
    <a href="#topo">Clique aqui para voltar ao Topo</a>
</body>
</html>
