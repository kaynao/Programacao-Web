<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Acesse seus pratos favoritos salvos no IFome! e peça com um clique." />
    <title>Meus Favoritos - IFome!</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="icon" type="image/png" href="img/favicon.png" />
    <script src="js/script.js" defer></script>
  </head>

  <body>
    <!-- Cabeçalho Padronizado -->
    <header id="topo">
      <h1><a href="index.html">IFome!</a></h1>

      <nav class="navigation">
        <ul>
          <li><a href="index.html#cardapio">Cardápio 🍽️</a></li>
          <li><a href="index.html#entregas">Horários &amp; Entregas 🛵</a></li>
          <li><a href="index.html#reserva">Carrinho &amp; Pedido 📆</a></li>
        </ul>
      </nav>

      <div class="icones-usuario">
        <a href="perfil.html" class="btn-icone" aria-label="Perfil">
          <span class="material-symbols-outlined">person</span>
        </a>
        <a href="favoritos.html" class="btn-icone" aria-label="Favoritos">
          <span class="material-symbols-outlined">favorite</span>
        </a>
        <a href="index.html#area-carrinho" class="btn-icone" aria-label="Carrinho">
          <span class="material-symbols-outlined">shopping_cart</span>
        </a>
      </div>
    </header>

    <main id="cardapio">
      <h2>Meus Pratos Favoritos ❤️</h2>
      <p id="msg-sem-favoritos" class="carrinho-vazio" style="display: none;">
        Você ainda não favoritou nenhum prato. Volte ao <a href="index.html#cardapio">cardápio</a> e clique no coração!
      </p>

      <!-- Grid onde os favoritos serão renderizados via DOM -->
      <div id="grid-favoritos" class="cardapio-grid"></div>
    </main>

    <footer>
      <p>&copy; 2026 IFome! - Todos os direitos reservados.</p>
    </footer>

    <script>
      const gridFavoritos = document.getElementById('grid-favoritos');
      const msgSemFavoritos = document.getElementById('msg-sem-favoritos');

      function formatarMoeda(valor) {
        return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      }

      function renderizarFavoritos() {
        const favoritos = JSON.parse(localStorage.getItem('favoritosIFome')) || [];
        gridFavoritos.innerHTML = '';

        if (favoritos.length === 0) {
          msgSemFavoritos.style.display = 'block';
          return;
        }

        msgSemFavoritos.style.display = 'none';

        favoritos.forEach((item, index) => {
          const article = document.createElement('article');
          article.classList.add('card');

          article.innerHTML = `
            <button type="button" class="btn-favorito favoritado" data-index="${index}" title="Remover dos favoritos">
              <span class="material-symbols-outlined">favorite</span>
            </button>
            <img src="${item.img}" alt="${item.nome}" />
            <h3>${item.nome}</h3>
            <p>${item.desc}</p>
            <span class="preco">${formatarMoeda(item.preco)}</span>
            <button type="button" class="btn-pedido btn-pedir-favorito" data-nome="${item.nome}" data-preco="${item.preco}">
              Pedir Agora
            </button>
          `;

          gridFavoritos.appendChild(article);
        });
      }

      // Delegação de eventos para remover favorito ou enviar para o carrinho
      gridFavoritos.addEventListener('click', (e) => {
        const btnFav = e.target.closest('.btn-favorito');
        if (btnFav) {
          const index = Number(btnFav.dataset.index);
          const favoritos = JSON.parse(localStorage.getItem('favoritosIFome')) || [];
          favoritos.splice(index, 1);
          localStorage.setItem('favoritosIFome', JSON.stringify(favoritos));
          renderizarFavoritos();
          return;
        }

        const btnPedir = e.target.closest('.btn-pedir-favorito');
        if (btnPedir) {
          const carrinho = JSON.parse(localStorage.getItem('carrinhoIFome')) || [];
          carrinho.push({
            nome: btnPedir.dataset.nome,
            preco: parseFloat(btnPedir.dataset.preco)
          });
          localStorage.setItem('carrinhoIFome', JSON.stringify(carrinho));
          alert(`"${btnPedir.dataset.nome}" foi adicionado ao seu carrinho!`);
          window.location.href = 'index.html#area-carrinho';
        }
      });

      renderizarFavoritos();
    </script>
  </body>
</html>
