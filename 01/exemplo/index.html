<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Aula 02</title>
    <style>
      body {
        background: linear-gradient(
          90deg,
          #e01b1b 0%,
          #ece9f0 50%,
          #29ad34 100%
        );
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <center>
      <p id="texto">Fluminense</p>
      <p id="texto2">Fluminense</p>
      <p id="texto3">Fluminense</p>

      <button onclick="resetarCores()">Resetar Cores</button>
      <button onclick="FluCores()">Flu Cores</button>
    </center>

    <script>
      function FluCores() {
        document.getElementById("texto").style.color = "red";
        document.getElementById("texto2").style.color = "white";
        document.getElementById("texto3").style.color = "green";
      }
      function resetarCores() {
        document.getElementById("texto").style.color = "white";
        document.getElementById("texto2").style.color = "white";
        document.getElementById("texto3").style.color = "white";
      }
    </script>
  </body>
</html>
